version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gosec
  settings:
    staticcheck:
      checks:
        - all
        # ST1005: dauerhaft deaktiviert, kein Schuldposten. Fehlertexte sind
        # deutsch, Substantive werden grossgeschrieben ("Datei ist leer").
        - -ST1005
  exclusions:
    rules:
      # gosec G301/G302/G306: Dateirechte 0644/0755 sind heutiges Verhalten.
      # Strengere Rechte: Befund S-12 / Task R-M3-04 (Verhaltensaenderung, nicht in M0).
      # Exclusion in R-M3-04 entfernen.
      - linters: [gosec]
        path: (^app\.go$|_test\.go$)
        text: "G30[126]:"
      # gosec G304: Der Watch-Ordner ist fremder Input (Symlinks). Befund S-04 /
      # Task R-M3-03. Exclusion in R-M3-03 entfernen.
      - linters: [gosec]
        path: ^app\.go$
        text: "G304:"
      # gosec G204: feste Programme (security, osascript, go); Argumente werden
      # nicht durch eine Shell interpretiert. Befund S-10 / Task R-M3-07.
      # Exclusion in R-M3-07 entfernen.
      - linters: [gosec]
        path: ^(app|config)\.go$
        text: "G204:"
      # version wird nur per -ldflags "-X main.version=..." gesetzt und per
      # "go version -m" gelesen (OD-02), nicht im Code.
      - path: ^main\.go$
        linters: [unused]
        text: "var version is unused"

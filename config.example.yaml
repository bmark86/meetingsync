# Exportordner von MacWhisper
watch_dir: ~/Meetings/MacWhisper
my_name: Mark
my_speaker_label: ""

include_transcript: false
use_summary_as_context: false
orphan_summary_action: note # note | archive | keep
transcript_extensions: []
summary_extensions: []
title_format: "{date} – {title}"
notify: true

llm:
  base_url: http://localhost:1234/v1
  model: gemma-4-31b # Identifier aus LM Studio
  temperature: 0.2
  max_chunk_chars: 60000
  structured_output: true

notion:
  token_keychain_service: meetingsync-notion
  notes_data_source_id: 276258fa-3c5b-801a-9ed7-000bd17dc7b5
  tasks_data_source_id: 26e258fa-3c5b-8086-b070-000b02927414
  projects_data_source_id: 26e258fa-3c5b-8055-9770-000b66f3bc38
  create_tasks_for: me # me | all | none
